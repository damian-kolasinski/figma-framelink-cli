name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64
            target: aarch64-apple-darwin
          - os: macos-14 # x86_64 cross from arm64 via Xcode toolchain
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm # native ARM, avoids cross gcc
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          bin=target/${{ matrix.target }}/release/figma-framelink-cli
          # NOTE: asset name intentionally has no version — install.sh and the
          # README curl snippets rely on the stable URL
          # .../releases/latest/download/figma-framelink-cli-<target>.tar.gz
          # (the version is already encoded in the release tag itself).
          archive=figma-framelink-cli-${{ matrix.target }}.tar.gz
          cp README.md LICENSE "$(dirname "$bin")/"
          tar czf "$archive" -C "$(dirname "$bin")" "$(basename "$bin")" README.md LICENSE
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
